services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
    ports:
      - "${HRIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hris-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      DATABASE_URL: postgres://hris:hris@postgres:5432/hris?sslmode=disable
    volumes:
      - ./db:/workspace/db:ro
    command: ["sh", "/workspace/db/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://hris:hris@postgres:5432/hris?sslmode=disable
      WEB_ORIGIN: http://localhost:${HRIS_WEB_PORT:-3000}
      JWT_SECRET: local-development-secret-change-before-production-2026
      BOOTSTRAP_ORG_NAME: Northstar Labs
      BOOTSTRAP_ORG_SLUG: northstar
      BOOTSTRAP_ADMIN_NAME: HRIS Administrator
      BOOTSTRAP_ADMIN_EMAIL: admin@advancehris.local
      BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      SEED_DEMO_DATA: "true"
      SEED_DEMO_PASSWORD: local-demo-password-2026
    ports:
      - "${HRIS_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:${HRIS_API_PORT:-8080}
      WEB_COOKIE_SECURE: "false"
    ports:
      - "${HRIS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/docs >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  hris-data:
