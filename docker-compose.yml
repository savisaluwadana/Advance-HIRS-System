services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
    ports:
      - "5432:5432"
    volumes:
      - hris-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://hris:hris@postgres:5432/hris?sslmode=disable
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: local-development-secret-change-before-production-2026
      BOOTSTRAP_ORG_NAME: Northstar Labs
      BOOTSTRAP_ORG_SLUG: northstar
      BOOTSTRAP_ADMIN_NAME: HRIS Administrator
      BOOTSTRAP_ADMIN_EMAIL: admin@advancehris.local
      BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      SEED_DEMO_DATA: "true"
      SEED_DEMO_PASSWORD: local-demo-password-2026
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  hris-data:
