name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build

  api:
    name: API + PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hris
          POSTGRES_USER: hris
          POSTGRES_PASSWORD: hris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hris -d hris"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      API_PORT: "8080"
      DATABASE_URL: postgres://hris:hris@localhost:5432/hris?sslmode=disable
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      BOOTSTRAP_ORG_NAME: Northstar Labs
      BOOTSTRAP_ORG_SLUG: northstar
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_EMAIL: admin@advancehris.local
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-2026
      SEED_DEMO_DATA: "true"
      SEED_DEMO_PASSWORD: ci-demo-password-2026
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/api/go.mod
      - run: go mod tidy
      - name: Initialize PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../db/schema.sql
      - name: Verify employee IDs are tenant scoped
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          WITH org AS (
            INSERT INTO organizations (name, slug) VALUES ('Tenant Two', 'tenant-two') RETURNING id
          )
          INSERT INTO employees (
            id, organization_id, employee_number, first_name, last_name, work_email,
            job_title, department, location, employment_type, status, server_version
          )
          SELECT 'emp_001', id, 'EMP-001', 'Second', 'Tenant', 'employee@tenant-two.local',
                 'Engineer', 'Engineering', 'Remote', 'full_time', 'active', 1
          FROM org;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../db/migrations/002_tenant_scoped_employee_ids.sql
      - run: go test ./...
      - run: go build ./cmd/server
      - name: API auth, RBAC, invitations, leave, attendance and audit smoke test
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/server >/tmp/advance-hris-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health >/dev/null
          JSON=(-H 'Content-Type: application/json')

          ADMIN_TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login "${JSON[@]}" \
            -d '{"email":"admin@advancehris.local","password":"ci-admin-password-2026","organization_slug":"northstar"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          ADMIN_AUTH=(-H "Authorization: Bearer $ADMIN_TOKEN")
          curl -sf http://localhost:8080/api/v1/auth/me "${ADMIN_AUTH[@]}" >/dev/null
          curl -sf http://localhost:8080/api/v1/employees "${ADMIN_AUTH[@]}" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] >= 4'

          HR_INVITE=$(curl -sf -X POST http://localhost:8080/api/v1/access/invitations \
            "${ADMIN_AUTH[@]}" "${JSON[@]}" -d '{"email":"hr-ci@northstar.local","role":"hr"}')
          HR_TOKEN=$(printf '%s' "$HR_INVITE" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["invitation"]["role"] == "hr"; print(data["token"])')
          test -n "$HR_TOKEN"
          curl -sf -X POST http://localhost:8080/api/v1/access/invitations/inspect "${JSON[@]}" \
            -d "{\"token\":\"$HR_TOKEN\"}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["email"] == "hr-ci@northstar.local" and data["existing_user"] is False'
          HR_ACCEPT=$(curl -sf -X POST http://localhost:8080/api/v1/access/invitations/accept "${JSON[@]}" \
            -d "{\"token\":\"$HR_TOKEN\",\"display_name\":\"CI HR\",\"password\":\"ci-hr-password-2026\"}")
          HR_ACCESS_TOKEN=$(printf '%s' "$HR_ACCEPT" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["created_user"] is True; print(data["access_token"])')
          HR_AUTH=(-H "Authorization: Bearer $HR_ACCESS_TOKEN")

          REUSE_STATUS=$(curl -s -o /tmp/reuse.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/access/invitations/accept "${JSON[@]}" \
            -d "{\"token\":\"$HR_TOKEN\",\"display_name\":\"Again\",\"password\":\"another-password-2026\"}")
          test "$REUSE_STATUS" = "404"

          HR_ESCALATION_STATUS=$(curl -s -o /tmp/hr-escalation.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/access/invitations \
            "${HR_AUTH[@]}" "${JSON[@]}" -d '{"email":"admin2@northstar.local","role":"admin"}')
          test "$HR_ESCALATION_STATUS" = "403"

          MISMATCH_STATUS=$(curl -s -o /tmp/invite-mismatch.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/access/invitations \
            "${HR_AUTH[@]}" "${JSON[@]}" -d '{"email":"wrong@northstar.local","role":"employee","employee_id":"emp_004"}')
          test "$MISMATCH_STATUS" = "400"
          JONAS_INVITE=$(curl -sf -X POST http://localhost:8080/api/v1/access/invitations \
            "${HR_AUTH[@]}" "${JSON[@]}" -d '{"email":"jonas@northstar.local","role":"employee","employee_id":"emp_004"}')
          JONAS_TOKEN=$(printf '%s' "$JONAS_INVITE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          JONAS_ACCEPT=$(curl -sf -X POST http://localhost:8080/api/v1/access/invitations/accept "${JSON[@]}" \
            -d "{\"token\":\"$JONAS_TOKEN\",\"display_name\":\"Jonas Lee\",\"password\":\"jonas-ci-password-2026\"}")
          JONAS_ACCESS_TOKEN=$(printf '%s' "$JONAS_ACCEPT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          JONAS_AUTH=(-H "Authorization: Bearer $JONAS_ACCESS_TOKEN")
          JONAS_LIST_STATUS=$(curl -s -o /tmp/jonas-list.json -w '%{http_code}' http://localhost:8080/api/v1/employees "${JONAS_AUTH[@]}")
          test "$JONAS_LIST_STATUS" = "403"
          curl -sf http://localhost:8080/api/v1/leave/requests "${JONAS_AUTH[@]}" \
            | python3 -c 'import json,sys; assert "data" in json.load(sys.stdin)'

          ADMIN_LEAVE_ID=$(curl -sf -X POST http://localhost:8080/api/v1/leave/requests \
            "${ADMIN_AUTH[@]}" "${JSON[@]}" \
            -d '{"employee_id":"emp_001","leave_type":"annual","start_date":"2026-09-20","end_date":"2026-09-21","reason":"CI admin workflow"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -sf -X POST "http://localhost:8080/api/v1/leave/requests/$ADMIN_LEAVE_ID/decision" \
            "${ADMIN_AUTH[@]}" "${JSON[@]}" -d '{"decision":"approved","note":"CI approval"}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "approved"'

          curl -sf -X POST http://localhost:8080/api/v1/attendance/check-in \
            "${ADMIN_AUTH[@]}" "${JSON[@]}" -d '{"employee_id":"emp_002","work_mode":"remote"}' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["employee_id"] == "emp_002" and data["check_in"]'
          curl -sf -X POST http://localhost:8080/api/v1/attendance/check-out \
            "${ADMIN_AUTH[@]}" "${JSON[@]}" -d '{"employee_id":"emp_002"}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["check_out"]'

          EMPLOYEE_TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login "${JSON[@]}" \
            -d '{"email":"ava@northstar.local","password":"ci-demo-password-2026","organization_slug":"northstar"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          EMPLOYEE_AUTH=(-H "Authorization: Bearer $EMPLOYEE_TOKEN")
          EMPLOYEE_LIST_STATUS=$(curl -s -o /tmp/employee-list.json -w '%{http_code}' http://localhost:8080/api/v1/employees "${EMPLOYEE_AUTH[@]}")
          test "$EMPLOYEE_LIST_STATUS" = "403"
          EMPLOYEE_LEAVE_ID=$(curl -sf -X POST http://localhost:8080/api/v1/leave/requests \
            "${EMPLOYEE_AUTH[@]}" "${JSON[@]}" \
            -d '{"leave_type":"annual","start_date":"2026-09-24","end_date":"2026-09-25","reason":"Employee self-service CI"}' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["employee_id"] == "emp_001"; print(data["id"])')

          MANAGER_TOKEN=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login "${JSON[@]}" \
            -d '{"email":"sara@northstar.local","password":"ci-demo-password-2026","organization_slug":"northstar"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          MANAGER_AUTH=(-H "Authorization: Bearer $MANAGER_TOKEN")
          curl -sf http://localhost:8080/api/v1/leave/requests "${MANAGER_AUTH[@]}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert any(x["employee_id"] == "emp_001" for x in data)'
          curl -sf -X POST "http://localhost:8080/api/v1/leave/requests/$EMPLOYEE_LEAVE_ID/decision" \
            "${MANAGER_AUTH[@]}" "${JSON[@]}" -d '{"decision":"approved","note":"Manager CI approval"}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "approved"'

          curl -sf http://localhost:8080/api/v1/attendance "${ADMIN_AUTH[@]}" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] >= 1'
          curl -sf http://localhost:8080/api/v1/access/invitations "${ADMIN_AUTH[@]}" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] >= 2'
          curl -sf 'http://localhost:8080/api/v1/audit?limit=50' "${ADMIN_AUTH[@]}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["total"] >= 10'

  desktop-ui:
    name: Desktop UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package.json
      - run: npm install
      - run: npm run build

  desktop-core:
    name: Desktop Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/desktop/go.mod
      - run: go mod tidy
      - run: go test ./internal/...
